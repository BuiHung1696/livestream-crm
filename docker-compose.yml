version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: livestream_crm_postgres
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password_secret
      POSTGRES_DB: livestream_crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: livestream_crm_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
